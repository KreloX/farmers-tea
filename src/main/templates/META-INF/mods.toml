modLoader="javafml"
loaderVersion="$loader_version_range"
license="$mod_license"
issueTrackerURL="$mod_github/issues"
#clientSideOnly=true

[[mods]]
modId="$mod_id"
version="$mod_version"
displayName="$mod_name"
updateJSONURL="$mod_github/raw/$minecraft_version/update.json"
displayURL="$mod_url"
logoFile="${mod_id}.png"
credits="$mod_credits"
authors="$mod_authors"
#displayTest="MATCH_VERSION"
description='''$mod_description'''

[[dependencies.$mod_id]]
    modId="forge"
    mandatory=true
    versionRange="$forge_version_range"
    ordering="NONE"
    side="BOTH"

[[dependencies.$mod_id]]
    modId="minecraft"
    mandatory=true
    versionRange="$minecraft_version_range"
    ordering="NONE"
    side="BOTH"

[[dependencies.$mod_id]]
    modId="farmersdelight"
    mandatory=true
    versionRange="1"
    ordering="NONE"
    side="BOTH"

#[features.$mod_id]
#openGLVersion="[3.2,)"
